name: FORGEX Real Engineering Verification

on:
  push:
    branches:
      - feat/real-engineering-agent
  pull_request:
    branches:
      - main
      - feat/provider-routing-foundation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Runtime smoke test
        run: npm run smoke

      - name: Full test suite
        run: npm test
