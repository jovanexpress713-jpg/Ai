name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run verification suite
        run: npm run check

      - name: Run Lab execution verification
        run: npx tsx scripts/lab-execution-tests.ts

      - name: Build production container
        run: docker build --tag forgex-ai-ci .
